<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0f0f0f;color:white;font-family:Arial;padding:15px;}
    .container{max-width:500px;margin:0 auto;}
    h1{color:#0088ff;text-align:center;margin-bottom:15px;font-size:18px;}
    .form-box{background:#151515;padding:15px;border-radius:12px;border:1px solid #333;}
    .form-group{margin-bottom:12px;}
    label{display:block;margin-bottom:5px;color:#aaa;font-size:12px;}
    input,textarea{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:white;font-size:13px;}
    textarea{min-height:80px;}
    .btn{background:#0088ff;color:white;padding:12px;border-radius:8px;border:none;font-weight:bold;width:100%;font-size:14px;cursor:pointer;}
    .btn-cancel{background:#666;margin-top:8px;}
    .type-badge{background:#ffaa00;color:#000;font-size:10px;padding:4px 8px;border-radius:5px;font-weight:bold;text-align:center;margin-bottom:12px;}
    .warning{color:#ff4444;font-size:11px;text-align:center;margin-top:10px;}
  </style>
</head>
<body>
<div class="container">
  <h1>✏️ Edit Post</h1>
  <div class="form-box">
    <div class="type-badge" id="typeBadge"></div>
    <form id="editForm">
      <div class="form-group">
        <label>Title *</label>
        <input id="editTitle" placeholder="Product Name / Job Title" required>
      </div>
      <div class="form-group">
        <label>Description *</label>
        <textarea id="editDesc" placeholder="Describe your product or job" required></textarea>
      </div>
      <div class="form-group">
        <label>Country / Region *</label>
        <input id="editCountry" placeholder="Nigeria, USA, Remote" list="countryList" required>
        <datalist id="countryList">
          <option value="Nigeria"><option value="Ghana"><option value="Kenya"><option value="South Africa">
          <option value="USA"><option value="UK"><option value="Canada"><option value="Remote"><option value="Other">
        </datalist>
      </div>
      <div class="form-group">
        <label>Price $ *</label>
        <input type="number" id="editPrice" step="0.01" placeholder="250.00" required>
      </div>
      
      <!-- JOB ONLY FIELDS -->
      <div class="form-group" id="companyBox" style="display:none;">
        <label>Company</label>
        <input id="editCompany" placeholder="Google Inc">
      </div>
      <div class="form-group" id="salaryBox" style="display:none;">
        <label>Salary</label>
        <input id="editSalary" placeholder="$500/month">
      </div>

      <button class="btn">💾 Save Changes</button>
      <button type="button" class="btn btn-cancel" onclick="location.href='index.html'">❌ Cancel</button>
      <p class="warning">Note: Editing will not remove it from marketplace</p>
    </form>
  </div>
</div>
<script>
if(localStorage.getItem("marketSaleLoggedIn")!== "true")location.href="login.html";

let user = JSON.parse(localStorage.getItem("marketSaleUser"));
let urlParams = new URLSearchParams(window.location.search);
let productId = urlParams.get('id');

let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
let product = products.find(p => p.id == productId);

// Security: Only owner can edit
if(!product || product.email !== user.email){
  alert("⛔ You can only edit your own posts");
  location.href="index.html";
}

// Fill form
document.getElementById("typeBadge").innerText = product.type === 'job' ? 'JOB POST' : 'PRODUCT';
editTitle.value = product.title;
editDesc.value = product.desc;
editCountry.value = product.country;
editPrice.value = product.price;

if(product.type === 'job'){
  document.getElementById("companyBox").style.display = 'block';
  document.getElementById("salaryBox").style.display = 'block';
  editCompany.value = product.company || '';
  editSalary.value = product.salary || '';
}

// Save
editForm.onsubmit = e => {
  e.preventDefault();
  product.title = editTitle.value;
  product.desc = editDesc.value;
  product.country = editCountry.value;
  product.price = editPrice.value;
  product.company = editCompany.value;
  product.salary = editSalary.value;
  product.date = new Date().toLocaleDateString(); // update date
  
  localStorage.setItem("marketSaleProducts", JSON.stringify(products));
  alert("✅ Post Updated Successfully!");
  location.href = "index.html";
}
</script>
</body>
</html>
