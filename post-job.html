<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Job</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0f0f0f;color:white;font-family:Arial;padding:15px;}
 .container{max-width:500px;margin:0 auto;}
    h1{color:#ffaa00;text-align:center;margin-bottom:15px;font-size:18px;}
 .form-box{background:#151515;padding:15px;border-radius:12px;border:1px solid #333;}
 .form-group{margin-bottom:12px;}
    label{display:block;margin-bottom:5px;color:#aaa;font-size:12px;}
    input,textarea{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:white;font-size:13px;}
    textarea{min-height:70px;}
 .btn{background:#ffaa00;color:#000;padding:12px;border-radius:8px;border:none;font-weight:bold;width:100%;font-size:14px;cursor:pointer;}
 .phone-group{display:flex;gap:8px;}
 .country-code{width:90px;background:#222;border:1px solid #333;border-radius:8px;color:white;padding:10px;text-align:center;}

 .payment-box{display:none;text-align:center;}
 .warning{background:#2a2000;color:#ffaa00;padding:10px;border-radius:8px;margin-bottom:15px;font-size:12px;}
 .qr-box{background:white;padding:15px;border-radius:10px;display:inline-block;margin:15px 0;}
 .wallet{background:#1a1a1a;padding:12px;border-radius:8px;margin:15px 0;}
 .id-box{background:#151515;border:1px solid #ffaa00;padding:12px;border-radius:8px;margin:15px 0;color:#ffaa00;font-weight:bold;}
  </style>
</head>
<body>
<div class="container">
  <h1 id="pageTitle">Post Job - $10/Month</h1>

  <div class="form-box" id="formSection">
    <form id="jobForm">
      <div class="form-group"><label>Job Title *</label><input id="jobTitle" required></div>
      <div class="form-group"><label>Job Description *</label><textarea id="jobDesc" required></textarea></div>
      <div class="form-group"><label>Company</label><input id="jobCompany"></div>
      <div class="form-group"><label>Salary</label><input id="jobSalary" placeholder="$500/month"></div>
      <div class="form-group"><label>Email</label><input type="email" id="jobEmail"></div>
      <div class="form-group">
        <label>WhatsApp *</label>
        <div class="phone-group">
          <input type="text" class="country-code" id="countryCode" value="+234" required>
          <input type="tel" id="jobWhatsapp" placeholder="803 123 4567" required>
        </div>
      </div>
      <button class="btn">Submit Job - Pay $10</button>
    </form>
  </div>

  <div class="form-box payment-box" id="paymentSection">
    <div class="warning">⚠️ $10 Fee For 1 Month Job Posting</div>
    <div class="id-box">Your Job ID: <span id="jobId"></span></div>
    <div class="qr-box"><img id="qrCode" width="200"></div>
    <div class="wallet">
      <div style="font-size:11px;color:#aaa;">USDT TRC20 Address</div>
      <div style="color:#ffaa00;font-family:monospace;font-size:12px;">TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T</div>
    </div>
    <button class="btn" onclick="navigator.clipboard.writeText('TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T')">📋 Copy Address</button>
    <div style="font-size:11px;color:#aaa;margin:10px 0;">After payment, send proof + Job ID to WhatsApp: <b>+2348031234567</b></div>
    <button class="btn" style="background:#25D366;" onclick="location.href='index.html'">Done</button>
  </div>
</div>

<script>
if(localStorage.getItem("marketSaleLoggedIn")!== "true")location.href="login.html";
let currentJobId='';
jobForm.onsubmit=e=>{
  e.preventDefault();
  currentJobId = 'JOB-' + Date.now();
  let fullWhatsApp = countryCode.value + jobWhatsapp.value.replace(/\s/g,'');

  let data={
    id:currentJobId,
    title:jobTitle.value,
    desc:jobDesc.value,
    company:jobCompany.value,
    salary:jobSalary.value,
    email:jobEmail.value,
    whatsapp:fullWhatsApp,
    price:'10',
    type:'job',
    status:'pending'
  };

  let p=JSON.parse(localStorage.getItem("marketSalePending"))||[];
  p.push(data);
  localStorage.setItem("marketSalePending",JSON.stringify(p));

  document.getElementById("formSection").style.display="none";
  document.getElementById("pageTitle").innerText="Pay $10";
  document.getElementById("paymentSection").style.display="block";
  document.getElementById("jobId").innerText=currentJobId;
  qrCode.src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T`;
};
</script>
</body>
</html>
