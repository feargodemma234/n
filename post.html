<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Product</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0f0f0f;color:white;font-family:Arial;padding:15px;}
   .container{max-width:500px;margin:0 auto;}
    h1{color:#00ff88;text-align:center;margin-bottom:15px;font-size:18px;}
   .form-box{background:#151515;padding:15px;border-radius:12px;border:1px solid #333;}
   .form-group{margin-bottom:12px;}
    label{display:block;margin-bottom:5px;color:#aaa;font-size:12px;}
    input,textarea{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:white;font-size:13px;}
    textarea{min-height:70px;}
   .btn{background:#00ff88;color:#000;padding:12px;border-radius:8px;border:none;font-weight:bold;width:100%;font-size:14px;cursor:pointer;}
   .image-upload{border:2px dashed #333;border-radius:10px;padding:15px;text-align:center;cursor:pointer;background:#1a1a1a;font-size:12px;}
   .image-preview{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;}
   .phone-group{display:flex;gap:8px;}
   .country-code{width:90px;background:#222;border:1px solid #333;border-radius:8px;color:white;padding:10px;text-align:center;}
   .payment-box{display:none;}
   .warning{background:#2a1f00;color:#ffaa00;padding:10px;border-radius:8px;margin-bottom:15px;font-size:12px;text-align:center;}
   .qr-box{background:white;padding:15px;border-radius:10px;text-align:center;margin:15px 0;}
   .wallet{background:#1a1a1a;padding:12px;border-radius:8px;margin:15px 0;text-align:center;}
   .id-box{background:#151515;border:1px solid #00ff88;padding:12px;border-radius:8px;margin:15px 0;color:#00ff88;font-weight:bold;text-align:center;}
   .note{font-size:11px;color:#aaa;margin:10px 0;text-align:center;}
  </style>
</head>
<body>
<div class="container">
  <h1 id="pageTitle">Post Product - $2</h1>
  <div class="form-box" id="formSection">
    <form id="postForm">
      <div class="form-group">
        <label>Product Image *</label>
        <div class="image-upload" onclick="productImage.click()">
          <span id="uploadText">📷 Tap to Upload Image</span>
          <img id="imagePreview" class="image-preview">
        </div>
        <input type="file" id="productImage" accept="image/*" style="display:none;" required>
      </div>
      <div class="form-group"><label>Product Name *</label><input id="productName" placeholder="iPhone 14 Pro" required></div>
      <div class="form-group"><label>Description *</label><textarea id="productDesc" placeholder="Brand new, 256GB, 1 year warranty" required></textarea></div>
      <div class="form-group">
        <label>Country / Region *</label>
        <input id="productCountry" placeholder="🔍 Type country... e.g Nigeria, USA" list="countryList" required>
        <datalist id="countryList">
          <option value="Nigeria"><option value="Ghana"><option value="Kenya"><option value="South Africa">
          <option value="USA"><option value="UK"><option value="Canada"><option value="Other">
        </datalist>
      </div>
      <div class="form-group">
        <label>WhatsApp *</label>
        <div class="phone-group">
          <input type="text" class="country-code" id="countryCode" value="+234" required>
          <input type="tel" id="productWhatsapp" placeholder="803 123 4567" required>
        </div>
      </div>
      <div class="form-group"><label>Price $ *</label><input type="number" id="productPrice" step="0.01" placeholder="250.00" required></div>
      <button class="btn">Submit Request</button>
    </form>
  </div>

  <div class="form-box payment-box" id="paymentSection">
    <div class="warning">⚠️ $2 Fee Required For Approval</div>
    <div class="id-box">Your Product ID: <span id="prodId"></span></div>
    <div class="qr-box"><img id="qrCode" width="200"></div>
    <div class="wallet">
      <div style="font-size:11px;color:#aaa;">USDT TRC20 Address</div>
      <div style="color:#00ff88;font-family:monospace;font-size:12px;word-break:break-all;">TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T</div>
    </div>
    <button class="btn" onclick="navigator.clipboard.writeText('TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T')">📋 Copy Address</button>
    <div class="note">Send payment proof to <b>feargodemma56@gmail.com</b> with your ID<br>Approval in 24 hrs</div>
    <button class="btn" style="background:#25D366;margin-top:10px;" onclick="location.href='index.html'">Go to Marketplace</button>
  </div>
</div>
<script>
if(localStorage.getItem("marketSaleLoggedIn")!== "true")location.href="login.html";
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
let imgData=''; let currentProductId='';
productImage.onchange=e=>{let r=new FileReader();r.onload=ev=>{imgData=ev.target.result;imagePreview.src=imgData;imagePreview.style.display='block';uploadText.style.display='none';};r.readAsDataURL(e.target.files[0]);};
postForm.onsubmit=e=>{
  e.preventDefault();
  if(!imgData)return alert("Upload image");
  currentProductId = 'MS-' + Date.now();
  let fullWhatsApp = countryCode.value + productWhatsapp.value.replace(/\s/g,'');
  let data={id:currentProductId,title:productName.value,desc:productDesc.value,country:productCountry.value,email:user.email,whatsapp:fullWhatsApp,price:productPrice.value,image:imgData,type:'product',status:'pending',date: new Date().toLocaleDateString()};
  let p=JSON.parse(localStorage.getItem("marketSalePending"))||[];p.push(data);localStorage.setItem("marketSalePending",JSON.stringify(p));
  document.getElementById("formSection").style.display="none";
  document.getElementById("pageTitle").innerText="Complete Payment";
  document.getElementById("paymentSection").style.display="block";
  document.getElementById("prodId").innerText=currentProductId;
  qrCode.src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T`;
};
</script>
</body>
</html>
