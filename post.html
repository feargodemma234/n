<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Product - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{background:#05050a;color:white;min-height:100vh;padding:20px;background-image: radial-gradient(circle at 20% 50%, rgba(0,255,136,0.05) 0%, transparent 50%);}
   .container{max-width:700px;margin:0 auto;}
   .back-btn{margin-bottom:15px;padding:10px 14px;background:rgba(0,204,255,0.15);color:#00ccff;border:1px solid rgba(0,204,255,0.3);border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;}
   .box{background:rgba(20,20,25,0.7);backdrop-filter:blur(15px);border:1px solid rgba(0,255,136,0.2);padding:25px;border-radius:16px;}
   .box h2{background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;margin-bottom:20px;text-align:center;font-weight:800;}
   .no-access{text-align:center;padding:40px 20px;}
   .no-access h3{color:#ff4444;font-size:18px;margin-bottom:10px;}
   .no-access p{color:#aaa;font-size:12px;margin-bottom:20px;line-height:1.6;}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#00ff88;}
    input,textarea,select{width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:10px;color:white;margin-bottom:15px;font-size:12px;}
    textarea{min-height:100px;resize:vertical;}
   .btn{padding:14px;border-radius:10px;border:none;font-size:13px;font-weight:800;cursor:pointer;width:100%;}
   .btn-green{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}
   .btn-red{background:linear-gradient(90deg,#ff4444,#ff6600);color:#fff;}
  </style>
</head>
<body>
<div class="container">
  <button class="back-btn" onclick="location.href='index.html'">← BACK TO HOME</button>

  <div class="box">
    <h2 id="formTitle">POST A PRODUCT</h2>

    <!-- NO ACCESS SCREEN -->
    <div id="accessBox" class="no-access" style="display:none;">
      <h3>❌ NO POSTING ACCESS</h3>
      <p>Your 30-day access has expired.<br>Please pay and contact admin to renew.</p>
      <button class="btn btn-red" onclick="location.href='payment.html'">PAY $10 TO RENEW</button>
    </div>

    <!-- FORM -->
    <div id="formBox" style="display:none;">
      <label>Product Title *</label>
      <input type="text" id="title" placeholder="iPhone 14 Pro Max">

      <label>Price ₦ *</label>
      <input type="number" id="price" placeholder="500000">

      <label>Category *</label>
      <select id="category">
        <option value="">Select Category</option>
        <option>Phones</option><option>Laptops</option><option>Cars</option>
        <option>Furniture</option><option>Clothes</option><option>Other</option>
      </select>

      <label>Description *</label>
      <textarea id="description" placeholder="Describe your product..."></textarea>

      <label>WhatsApp Number *</label>
      <input type="text" id="whatsapp" placeholder="2348012345678">

      <label>Location</label>
      <input type="text" id="location" placeholder="Port Harcourt">

      <label>Product Image</label>
      <input type="file" id="image" accept="image/*">

      <button class="btn btn-green" onclick="submitProduct()">SUBMIT FOR APPROVAL</button>
    </div>
  </div>
</div>

<script>
const ADMIN_EMAIL = "marketsaleofficial@gmail.com";

let loggedIn = localStorage.getItem("marketSaleLoggedIn");
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
if(loggedIn!== "true" ||!user){ location.href = "login.html"; }

// CHECK GLOBAL PAID LIST
let paidUsers = JSON.parse(localStorage.getItem("marketSalePaidUsers")) || [];
let paidUser = paidUsers.find(u => u.email === user.email);
let accessUntil = paidUser? new Date(paidUser.accessUntil) : null;

let accessBox = document.getElementById("accessBox");
let formBox = document.getElementById("formBox");

if(!accessUntil || accessUntil <= new Date()){
  accessBox.style.display = 'block';
  formBox.style.display = 'none';
} else {
  accessBox.style.display = 'none';
  formBox.style.display = 'block';
}

let editId = localStorage.getItem("editId");
let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];

if(editId){
  document.getElementById("formTitle").innerText = "EDIT PRODUCT";
  let p = products.find(x => x.id == editId);
  if(p){
    document.getElementById("title").value = p.title;
    document.getElementById("price").value = p.price;
    document.getElementById("category").value = p.category;
    document.getElementById("description").value = p.description;
    document.getElementById("whatsapp").value = p.whatsapp;
    document.getElementById("location").value = p.location;
  }
}

function submitProduct(){
  if(!accessUntil || accessUntil <= new Date()){
    location.href = 'payment.html';
    return;
  }

  let title = document.getElementById("title").value.trim();
  let price = document.getElementById("price").value;
  let category = document.getElementById("category").value;
  let description = document.getElementById("description").value.trim();
  let whatsapp = document.getElementById("whatsapp").value.trim();
  let location = document.getElementById("location").value.trim();
  let image = document.getElementById("image").files[0];

  if(!title ||!price ||!category ||!description ||!whatsapp) {
    alert("❌ Fill all required fields");
    return;
  }

  let reader = new FileReader();
  reader.onload = function(e){
    let imgData = image? e.target.result : null;

    if(editId){
      let p = products.find(x => x.id == editId);
      p.title = title; p.price = price; p.category = category;
      p.description = description; p.whatsapp = whatsapp; p.location = location;
      if(imgData) p.image = imgData;
      p.approved = false;
      localStorage.setItem("marketSaleProducts", JSON.stringify(products));
      localStorage.removeItem("editId");
      alert("✅ Product updated! Waiting for admin approval");
    } else {
      let newProduct = {
        id: Date.now(), title, price, category, description, whatsapp, location,
        image: imgData, seller: user.email, approved: false, date: new Date().toLocaleString()
      };
      products.push(newProduct);
      localStorage.setItem("marketSaleProducts", JSON.stringify(products));
      alert("✅ Product submitted! Waiting for admin approval");
    }
    location.href = "index.html";
  };

  if(image) reader.readAsDataURL(image);
  else reader.onload();
}
</script>
</body>
</html>
