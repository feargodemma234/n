<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{background:#05050a;color:white;background-image: radial-gradient(circle at 20% 50%, rgba(0,255,136,0.05) 0%, transparent 50%);min-height:100vh;padding:20px;}
    header{max-width:1200px;margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between;}
   .logo{display:flex;align-items:center;gap:10px;}
   .logo img{width:40px;height:40px;border-radius:12px;border:2px solid #00ff88;}
   .logo h1{background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;font-weight:800;}
   .btn-back{padding:10px 16px;background:rgba(50,50,50,0.8);color:white;border:1px solid #444;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;}

   .tabs{display:flex;gap:10px;margin-bottom:20px;max-width:1200px;margin:0 auto 20px;}
   .tab{flex:1;padding:12px;text-align:center;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;background:rgba(20,20,25,0.6);border:1px solid rgba(0,255,136,0.1);color:#888;}
   .tab.active{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;border:none;}

   .container{max-width:1200px;margin:0 auto;}
   .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;}
   .card{background:rgba(20,20,25,0.6);backdrop-filter:blur(15px);border:1px solid rgba(0,255,136,0.15);border-radius:14px;overflow:hidden;}
   .card-img{width:100%;height:160px;object-fit:cover;background:#111;}
   .card-body{padding:12px;}
   .card-title{font-size:14px;font-weight:700;margin-bottom:6px;}
   .card-price{font-size:16px;font-weight:800;color:#00ff88;margin-bottom:6px;}
   .card-desc{font-size:11px;color:#aaa;margin-bottom:8px;height:32px;overflow:hidden;}
   .status{font-size:9px;padding:3px 6px;border-radius:5px;font-weight:700;}
   .status.pending{background:rgba(255,170,0,0.2);color:#ffaa00;}
   .status.live{background:rgba(0,255,136,0.2);color:#00ff88;}
   .my-btns{display:flex;gap:6px;margin-top:10px;}
   .btn-sm{flex:1;padding:7px;font-size:10px;border-radius:6px;border:none;cursor:pointer;font-weight:700;}
   .btn-edit{background:rgba(0,204,255,0.2);color:#00ccff;}
   .btn-delete{background:rgba(255,68,68,0.2);color:#ff4444;}
   .empty{text-align:center;padding:60px 20px;color:#555;}
   .empty a{color:#00ff88;text-decoration:none;font-weight:700;}
   .msg{padding:12px;border-radius:10px;margin-bottom:15px;font-size:12px;text-align:center;display:none;font-weight:600;}
   .msg.success{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.3);}
  </style>
</head>
<body>

<header>
  <div class="logo"><img src="logo.png" alt="Logo"><h1>MY LISTINGS</h1></div>
  <a href="index.html" class="btn-back">← HOME</a>
</header>

<div class="msg success" id="msgBox"></div>

<div class="tabs">
  <div class="tab active" id="myProductsTab" onclick="switchTab('products')">🛍️ MY PRODUCTS</div>
  <div class="tab" id="myJobsTab" onclick="switchTab('jobs')">💼 MY JOBS</div>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
if(!user) location.href = "login.html";

let currentTab = 'products';
function showMsg(text){ let box=document.getElementById('msgBox'); box.innerText=text; box.style.display='block'; setTimeout(()=>box.style.display='none',3000); }

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('my'+tab.charAt(0).toUpperCase()+tab.slice(1)+'Tab').classList.add('active');
  loadData();
}

function deleteItem(id, type){
  if(!confirm("Delete this item?")) return;
  if(type === 'product'){
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    products = products.filter(p => p.id !== id);
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
  } else {
    let jobs = JSON.parse(localStorage.getItem("marketSaleJobs")) || [];
    jobs = jobs.filter(j => j.id !== id);
    localStorage.setItem("marketSaleJobs", JSON.stringify(jobs));
  }
  showMsg("✅ Deleted");
  loadData();
}

function editItem(id, type){
  localStorage.setItem("editId", id);
  localStorage.setItem("editType", type);
  location.href = type === 'product' ? 'post.html?edit=1' : 'job.html?edit=1';
}

function loadData(){
  let grid = document.getElementById("grid");
  if(currentTab === 'products'){
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    let mine = products.filter(p => p.seller === user.email); // ONLY MY ITEMS
    if(mine.length === 0){ grid.innerHTML = `<div class="empty"><h3>No products yet</h3><p><a href="post.html">+ Post your first product</a></p></div>`; return; }
    grid.innerHTML = mine.reverse().map(p => `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/400x300/111/00ff88?text=No+Image'}" class="card-img">
        <div class="card-body">
          <div class="card-title">${p.title}</div>
          <div class="card-price">₦${Number(p.price).toLocaleString()}</div>
          <div class="card-desc">${p.description}</div>
          <span class="status ${p.approved ? 'live' : 'pending'}">${p.approved ? 'LIVE' : 'PENDING APPROVAL'}</span>
          <div class="my-btns">
            <button class="btn-sm btn-edit" onclick="editItem(${p.id},'product')">EDIT</button>
            <button class="btn-sm btn-delete" onclick="deleteItem(${p.id},'product')">DELETE</button>
          </div>
        </div>
      </div>`).join('');
  } else {
    let jobs = JSON.parse(localStorage.getItem("marketSaleJobs")) || [];
    let mine = jobs.filter(j => j.seller === user.email); // ONLY MY JOBS
    if(mine.length === 0){ grid.innerHTML = `<div class="empty"><h3>No jobs yet</h3><p><a href="job.html">+ Post your first job</a></p></div>`; return; }
    grid.innerHTML = mine.reverse().map(j => `
      <div class="card" style="border-color:rgba(0,204,255,0.15)">
        <div class="card-body">
          <div class="card-title">${j.title}</div>
          <div class="card-price" style="color:#00ccff">${j.salary || 'Negotiable'}</div>
          <div class="card-desc">${j.description}</div>
          <span class="status live">LIVE</span>
          <div class="my-btns">
            <button class="btn-sm btn-edit" onclick="editItem(${j.id},'job')">EDIT</button>
            <button class="btn-sm btn-delete" onclick="deleteItem(${j.id},'job')">DELETE</button>
          </div>
        </div>
      </div>`).join('');
  }
}
loadData();
</script>
</body>
</html>
