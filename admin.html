<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{background:#05050a;color:white;padding:20px;background-image: radial-gradient(circle at 20% 50%, rgba(255,170,0,0.05) 0%, transparent 50%);min-height:100vh;}
    .container{max-width:1200px;margin:0 auto;}
    .back-btn{margin-bottom:15px;padding:10px 14px;background:rgba(0,204,255,0.15);color:#00ccff;border:1px solid rgba(0,204,255,0.3);border-radius:8px;cursor:pointer;font-weight:700;}
    h1{margin-bottom:20px;background:linear-gradient(90deg,#ffaa00,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:24px;}
    .tabs{display:flex;gap:10px;margin-bottom:20px;background:rgba(20,20,25,0.6);padding:6px;border-radius:12px;border:1px solid rgba(255,170,0,0.1);}
    .tab{flex:1;padding:10px 20px;text-align:center;background:transparent;border-radius:8px;cursor:pointer;font-weight:700;color:#888;transition:0.3s;}
    .tab.active{background:linear-gradient(90deg,#ffaa00,#ff6600);color:#000;}
    .card{background:rgba(20,20,25,0.7);backdrop-filter:blur(15px);border:1px solid rgba(255,170,0,0.2);padding:15px;border-radius:12px;margin-bottom:12px;}
    .card h3{color:#ffaa00;margin-bottom:8px;font-size:14px;font-weight:800;}
    .card p{font-size:11px;color:#aaa;margin-bottom:4px;word-break:break-all;}
    .card p b{color:#ccc;}
    .btn{padding:8px 12px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;margin-right:6px;margin-top:8px;transition:0.2s;}
    .btn:hover{transform:translateY(-1px);}
    .btn-approve{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}
    .btn-reject{background:rgba(255,68,68,0.2);color:#ff4444;border:1px solid rgba(255,68,68,0.3);}
    .btn-grant{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}
    .btn-delete{background:rgba(255,68,68,0.2);color:#ff4444;border:1px solid rgba(255,68,68,0.3);}
    .empty{text-align:center;padding:40px;color:#555;}
    .empty h3{margin-bottom:8px;}
    .loading{text-align:center;padding:40px;color:#00ff88;}
  </style>
</head>
<body>
<div class="container">
  <button class="back-btn" onclick="location.href='index.html'">← BACK TO SITE</button>
  <h1>⚡ ADMIN PANEL</h1>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('pending', this)">PENDING POSTS</div>
    <div class="tab" onclick="switchTab('payments', this)">PENDING PAYMENTS</div>
    <div class="tab" onclick="switchTab('users', this)">ACTIVE USERS</div>
  </div>

  <div id="content"><div class="loading">Loading...</div></div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co' // <-- PASTE YOUR URL HERE
const SUPABASE_KEY = 'YOUR-ANON-KEY' // <-- PASTE YOUR ANON KEY HERE
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const ADMIN_EMAIL = "marketsaleofficial@gmail.com";
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
if(!user || user.email.toLowerCase() !== ADMIN_EMAIL) location.href = "index.html";

let currentTab = 'pending';

function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadData();
}

async function approvePost(id){
  const { error } = await supabase.from('products').update({approved: true}).eq('id', id);
  if(error) return alert("Error: " + error.message);
  alert("✅ Post approved");
  loadData();
}

async function deletePost(id){
  if(!confirm("Delete this post?")) return;
  const { error } = await supabase.from('products').delete().eq('id', id);
  if(error) return alert("Error: " + error.message);
  alert("🗑️ Post deleted");
  loadData();
}

async function grantAccess(email){
  let newDate = new Date();
  newDate.setDate(newDate.getDate() + 30);
  
  // 1. Add to paid_users table
  const { error: e1 } = await supabase.from('paid_users').upsert({
    email: email, 
    access_until: newDate.toISOString(),
    granted_date: new Date().toLocaleString()
  });
  if(e1) return alert("Error: " + e1.message);
  
  // 2. Mark payment as approved
  await supabase.from('payments').update({status: 'approved'}).eq('email', email);
  
  alert(`✅ Access granted to ${email} for 30 days`);
  loadData();
}

async function rejectPayment(id){
  if(!confirm("Reject this payment?")) return;
  const { error } = await supabase.from('payments').update({status: 'rejected'}).eq('id', id);
  if(error) return alert("Error: " + error.message);
  alert("❌ Payment rejected");
  loadData();
}

async function revokeAccess(email){
  if(!confirm(`Revoke access for ${email}?`)) return;
  const { error } = await supabase.from('paid_users').delete().eq('email', email);
  if(error) return alert("Error: " + error.message);
  alert("❌ Access revoked");
  loadData();
}

async function loadData(){
  let content = document.getElementById("content");
  content.innerHTML = `<div class="loading">Loading...</div>`;
  
  if(currentTab === 'pending'){
    let { data: products, error } = await supabase.from('products').select('*').eq('approved', false).order('id', {ascending: false});
    if(error) return content.innerHTML = `<div class="empty"><h3>Error loading</h3></div>`;
    if(!products || products.length === 0){
      content.innerHTML = `<div class="empty"><h3>No pending posts</h3><p>All posts are approved</p></div>`;
      return;
    }
    content.innerHTML = products.map(p => `
      <div class="card">
        <h3>${p.title} - ₦${Number(p.price).toLocaleString()}</h3>
        <p><b>Seller:</b> ${p.seller}</p>
        <p><b>WhatsApp:</b> ${p.whatsapp}</p>
        <p><b>Category:</b> ${p.category}</p>
        <p><b>Desc:</b> ${p.description}</p>
        <button class="btn btn-approve" onclick="approvePost(${p.id})">APPROVE</button>
        <button class="btn btn-delete" onclick="deletePost(${p.id})">DELETE</button>
      </div>
    `).join('');
  }
  
  if(currentTab === 'payments'){
    let { data: payments, error } = await supabase.from('payments').select('*').eq('status', 'pending').order('id', {ascending: false});
    if(error) return content.innerHTML = `<div class="empty"><h3>Error loading</h3></div>`;
    if(!payments || payments.length === 0){
      content.innerHTML = `<div class="empty"><h3>No pending payments</h3><p>Waiting for proof submissions</p></div>`;
      return;
    }
    content.innerHTML = payments.map(p => `
      <div class="card">
        <h3>PAYMENT FROM: ${p.email}</h3>
        <p><b>Amount:</b> ${p.amount} ${p.currency}</p>
        <p><b>TX Hash:</b> ${p.tx}</p>
        <p><b>Date:</b> ${new Date(p.created_at).toLocaleString()}</p>
        <p><b>Status:</b> ${p.status}</p>
        <button class="btn btn-grant" onclick="grantAccess('${p.email}')">GRANT 30 DAYS</button>
        <button class="btn btn-reject" onclick="rejectPayment(${p.id})">REJECT</button>
      </div>
    `).join('');
  }

  if(currentTab === 'users'){
    let { data: paidUsers, error } = await supabase.from('paid_users').select('*').order('access_until', {ascending: false});
    if(error) return content.innerHTML = `<div class="empty"><h3>Error loading</h3></div>`;
    let active = paidUsers.filter(u => new Date(u.access_until) > new Date());
    if(!active || active.length === 0){
      content.innerHTML = `<div class="empty"><h3>No active users</h3><p>Grant access to see users here</p></div>`;
      return;
    }
    content.innerHTML = active.map(u => {
      let days = Math.ceil((new Date(u.access_until) - new Date()) / (1000*60*60*24));
      return `
      <div class="card">
        <h3>${u.email}</h3>
        <p><b>Access Expires:</b> ${new Date(u.access_until).toLocaleDateString()}</p>
        <p><b>Days Left:</b> ${days} days</p>
        <p><b>Granted:</b> ${u.granted_date || 'N/A'}</p>
        <button class="btn btn-delete" onclick="revokeAccess('${u.email}')">REVOKE ACCESS</button>
      </div>
      `;
    }).join('');
  }
}

loadData();
</script>
</body>
</html>
