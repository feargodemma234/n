<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0f0f0f;color:white;font-family:Arial;padding:15px;}
    .container{max-width:800px;margin:0 auto;}
    h1{color:#00ff88;text-align:center;margin-bottom:15px;font-size:18px;}
    .search-box{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:white;margin-bottom:15px;}
    .card{background:#151515;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:10px;}
    img{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px;}
    .id{color:#00ff88;font-size:10px;font-weight:bold;}
    .badge{background:#ffaa00;color:#000;font-size:8px;padding:2px 5px;border-radius:4px;font-weight:bold;margin-left:5px;}
    .title{color:#00ff88;font-size:14px;font-weight:bold;}
    .price{font-size:15px;font-weight:bold;}
    .info{color:#aaa;font-size:10px;margin:5px 0;}
    .btns{display:flex;gap:8px;}
    .btn-a{background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px;width:50%;font-weight:bold;font-size:12px;cursor:pointer;}
    .btn-r{background:#ff4444;color:white;padding:10px;border:none;border-radius:8px;width:50%;font-weight:bold;font-size:12px;cursor:pointer;}
    .error{text-align:center;padding:60px 20px;color:#ff4444;}
  </style>
</head>
<body>
<div class="container" id="adminPanel" style="display:none;">
  <h1>🔒 Admin Panel</h1>
  <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by ID, Name, Email...">
  <div id="list"></div>
</div>
<div class="error" id="noAccess" style="display:none;">
  <h2>⛔ Access Denied</h2>
  <p>Only admin can view this page</p>
</div>
<script>
const ADMIN_EMAIL = "feargodemma56@gmail.com";
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
if(!user || user.email !== ADMIN_EMAIL){
  document.getElementById("noAccess").style.display = "block";
} else {
  document.getElementById("adminPanel").style.display = "block";
  load();
}
let pending = JSON.parse(localStorage.getItem("marketSalePending")) || [];
let approved = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
function load(filter=""){
  let filtered = pending.filter(p => p.id.toLowerCase().includes(filter) || p.title.toLowerCase().includes(filter) || p.email.toLowerCase().includes(filter));
  if(filtered.length == 0) { list.innerHTML = "<h2 style='text-align:center;color:#666;font-size:14px'>No pending products</h2>"; return; }
  list.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="id">ID: ${p.id} ${p.type==='job'?'<span class="badge">JOB</span>':''}</div>
      <img src="${p.image}">
      <div class="title">${p.title}</div>
      <div class="price">$${p.price}</div>
      <div class="info">Email: ${p.email}<br>WA: ${p.whatsapp}</div>
      <div class="btns">
        <button class="btn-a" onclick="approve('${p.id}')">✅ Approve</button>
        <button class="btn-r" onclick="reject('${p.id}')">❌ Reject</button>
      </div>
    </div>
  `).join('')
}
document.getElementById("searchInput").onkeyup = (e) => load(e.target.value.toLowerCase());
function approve(id){
  let prod = pending.find(p => p.id == id);
  approved.push(prod);
  pending = pending.filter(p => p.id!= id);
  localStorage.setItem("marketSaleProducts", JSON.stringify(approved));
  localStorage.setItem("marketSalePending", JSON.stringify(pending));
  load(document.getElementById("searchInput").value.toLowerCase())
}
function reject(id){
  pending = pending.filter(p => p.id!= id);
  localStorage.setItem("marketSalePending", JSON.stringify(pending));
  load(document.getElementById("searchInput").value.toLowerCase())
}
</script>
</body>
</html>
