<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{background:#05050a;color:white;padding:20px;background-image: radial-gradient(circle at 20% 50%, rgba(255,170,0,0.08) 0%, transparent 50%);}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;}
    .logo{display:flex;align-items:center;gap:10px;}
    .logo img{width:40px;height:40px;border-radius:12px;border:2px solid #ffaa00;}
    .logo h1{background:linear-gradient(90deg,#ffaa00,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;font-weight:800;}
    .btn-back{padding:10px 16px;background:rgba(50,50,50,0.8);color:white;border:1px solid #444;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;}
    
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px;}
    .stat-box{background:rgba(20,20,25,0.6);backdrop-filter:blur(15px);padding:20px;border-radius:15px;border:1px solid rgba(255,170,0,0.2);}
    .stat-box h3{font-size:12px;color:#aaa;margin-bottom:8px;}
    .stat-box p{font-size:24px;font-weight:800;color:#ffaa00;}

    .section{background:rgba(20,20,25,0.6);backdrop-filter:blur(15px);padding:20px;border-radius:15px;border:1px solid rgba(255,170,0,0.2);margin-bottom:20px;}
    .section h2{font-size:16px;margin-bottom:15px;color:#ffaa00;}
    .item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(30,30,30,0.5);border-radius:10px;margin-bottom:10px;}
    .item-info{font-size:12px;}
    .item-info b{color:#00ff88;}
    .btn-del{padding:6px 10px;background:rgba(255,68,68,0.1);color:#ff4444;border:1px solid rgba(255,68,68,0.3);border-radius:8px;font-size:10px;cursor:pointer;}
    .empty{color:#555;text-align:center;padding:20px;}
    @media(min-width:769px){.stats{grid-template-columns:repeat(4,1fr);}}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <h1>ADMIN PANEL</h1>
  </div>
  <a href="index.html" class="btn-back">← HOME</a>
</header>

<div class="stats">
  <div class="stat-box"><h3>TOTAL USERS</h3><p id="totalUsers">0</p></div>
  <div class="stat-box"><h3>TOTAL ITEMS</h3><p id="totalItems">0</p></div>
</div>

<div class="section">
  <h2>ALL USERS</h2>
  <div id="usersList"></div>
</div>

<div class="section">
  <h2>ALL PRODUCTS</h2>
  <div id="productsList"></div>
</div>

<script>
const ADMIN_EMAIL = "marketsaleofficial@gmail.com";
let user = JSON.parse(localStorage.getItem("marketSaleUser"));

// BLOCK NON-ADMIN
if(!user || user.email.toLowerCase() !== ADMIN_EMAIL){
  alert("Access Denied");
  location.href = "index.html";
}

function loadData(){
  let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  
  document.getElementById("totalUsers").innerText = users.length;
  document.getElementById("totalItems").innerText = products.length;

  // USERS
  let usersDiv = document.getElementById("usersList");
  if(users.length === 0) usersDiv.innerHTML = `<div class="empty">No users yet</div>`;
  else usersDiv.innerHTML = users.map(u => `
    <div class="item">
      <div class="item-info"><b>${u.email}</b></div>
      <button class="btn-del" onclick="deleteUser('${u.email}')">DELETE</button>
    </div>
  `).join('');

  // PRODUCTS
  let productsDiv = document.getElementById("productsList");
  if(products.length === 0) productsDiv.innerHTML = `<div class="empty">No products yet</div>`;
  else productsDiv.innerHTML = products.map(p => `
    <div class="item">
      <div class="item-info"><b>${p.title}</b> - ₦${Number(p.price).toLocaleString()}<br><span style="color:#888;font-size:10px;">by ${p.seller}</span></div>
      <button class="btn-del" onclick="deleteProduct(${p.id})">DELETE</button>
    </div>
  `).join('');
}

function deleteUser(email){
  if(confirm("Delete this user?")){
    let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
    users = users.filter(u => u.email !== email);
    localStorage.setItem("marketSaleUsers", JSON.stringify(users));
    loadData();
  }
}

function deleteProduct(id){
  if(confirm("Delete this product?")){
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    products = products.filter(p => p.id !== id);
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
    loadData();
  }
}

loadData();
</script>
</body>
</html>
