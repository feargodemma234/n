<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{
      background:#05050a;color:white;
      background-image: radial-gradient(circle at 20% 50%, rgba(0,255,136,0.05) 0%, transparent 50%);
      min-height:100vh;
    }

    /* COMPACT HEADER */
    header{
      position:sticky;top:0;z-index:100;
      background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(0,255,136,0.1);
      padding:10px 12px;display:flex;align-items:center;justify-content:space-between;
    }
    .logo{display:flex;align-items:center;gap:8px;}
    .logo img{width:32px;height:32px;border-radius:8px;border:1.5px solid #00ff88;}
    .logo h1{background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:15px;font-weight:800;}
    
    .header-btns{display:flex;gap:6px;align-items:center;}
    .btn{padding:7px 10px;border-radius:8px;border:none;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.3s;white-space:nowrap;}
    .btn-green{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}
    .btn-red{background:rgba(255,68,68,0.1);color:#ff4444;border:1px solid rgba(255,68,68,0.3);}
    .btn-admin{background:linear-gradient(90deg,#ffaa00,#ff6600);color:#000;display:none;}
    .user-email{display:none;}

    /* TABS */
    .tabs{display:flex;gap:8px;margin:15px 12px;background:rgba(20,20,25,0.6);padding:6px;border-radius:12px;border:1px solid rgba(0,255,136,0.1);}
    .tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:0.3s;color:#888;}
    .tab.active{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}

    /* CONTAINER */
    .container{max-width:1400px;margin:0 auto;padding:0 12px 20px;}
    .hero{text-align:center;margin-bottom:15px;padding:8px 0;}
    .hero h2{font-size:18px;margin-bottom:4px;background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .hero p{color:#888;font-size:10px;}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .card{
      background:rgba(20,20,25,0.6);backdrop-filter:blur(15px);
      border:1px solid rgba(0,255,136,0.15);border-radius:14px;
      overflow:hidden;transition:all 0.3s;cursor:pointer;
    }
    .card:hover{transform:translateY(-4px);border-color:rgba(0,255,136,0.4);box-shadow:0 8px 30px rgba(0,255,136,0.15);}
    .card-img{width:100%;height:140px;object-fit:cover;background:#111;}
    .card-body{padding:10px;}
    .card-title{font-size:13px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .card-price{font-size:15px;font-weight:800;color:#00ff88;margin-bottom:6px;}
    .card-desc{font-size:10px;color:#aaa;margin-bottom:8px;height:28px;overflow:hidden;line-height:1.4;}
    .card-footer{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#666;}
    .badge{padding:3px 6px;background:rgba(0,204,255,0.1);color:#00ccff;border-radius:5px;font-size:9px;}
    
    /* JOB CARD SPECIAL */
    .card.job{border-color:rgba(0,204,255,0.15);}
    .card.job:hover{border-color:rgba(0,204,255,0.4);box-shadow:0 8px 30px rgba(0,204,255,0.15);}
    .card.job .card-price{color:#00ccff;}

    .empty{text-align:center;padding:40px 20px;color:#555;}
    .empty h3{font-size:16px;margin-bottom:8px;}
    .empty p{font-size:12px;}

    /* DESKTOP */
    @media(min-width:769px){
      .user-email{display:block;font-size:11px;color:#888;margin-right:10px;}
      .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
      .hero h2{font-size:24px;}
      .card-img{height:180px;}
      .btn{padding:9px 14px;font-size:12px;}
      .tabs{max-width:1400px;margin:20px auto;}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <h1>MarketSale</h1>
  </div>
  <div class="header-btns">
    <span class="user-email" id="userEmail"></span>
    <button class="btn btn-admin" id="adminBtn" onclick="location.href='admin.html'">ADMIN</button>
    <button class="btn btn-green" id="postBtn" onclick="location.href='post.html'">+SELL</button>
    <button class="btn btn-red" onclick="logout()">OUT</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="productsTab" onclick="switchTab('products')">🛍️ PRODUCTS</div>
  <div class="tab" id="jobsTab" onclick="switchTab('jobs')">💼 JOBS</div>
</div>

<div class="container">
  <div class="hero">
    <h2 id="heroTitle">Find Your Next Deal</h2>
    <p id="heroDesc">Buy and sell in Port Harcourt</p>
  </div>

  <div class="grid" id="grid">
    <div class="empty"><h3>No items yet</h3><p>Be the first to post!</p></div>
  </div>
</div>

<script>
const ADMIN_EMAIL = "marketsaleofficial@gmail.com";
let currentTab = 'products';

let loggedIn = localStorage.getItem("marketSaleLoggedIn");
let user = JSON.parse(localStorage.getItem("marketSaleUser"));

if(loggedIn !== "true" || !user){
  location.href = "login.html";
}

document.getElementById("userEmail").innerText = user.email;

if(user.email.toLowerCase() === ADMIN_EMAIL){
  document.getElementById("adminBtn").style.display = "block";
}

function logout(){
  localStorage.removeItem("marketSaleLoggedIn");
  localStorage.removeItem("marketSaleUser");
  location.href = "login.html";
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  
  if(tab === 'products'){
    document.getElementById('productsTab').classList.add('active');
    document.getElementById('heroTitle').innerText = 'Find Your Next Deal';
    document.getElementById('heroDesc').innerText = 'Buy and sell in Port Harcourt';
    document.getElementById('postBtn').innerText = '+SELL';
    document.getElementById('postBtn').onclick = () => location.href='post.html';
  } else {
    document.getElementById('jobsTab').classList.add('active');
    document.getElementById('heroTitle').innerText = 'Find Your Next Job';
    document.getElementById('heroDesc').innerText = 'Work opportunities in Port Harcourt';
    document.getElementById('postBtn').innerText = '+JOB';
    document.getElementById('postBtn').onclick = () => location.href='job.html';
  }
  loadData();
}

function loadData(){
  let grid = document.getElementById("grid");
  
  if(currentTab === 'products'){
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    if(products.length === 0){
      grid.innerHTML = `<div class="empty"><h3>No products yet</h3><p>Be the first to sell!</p></div>`;
      return;
    }
    grid.innerHTML = products.reverse().map(p => `
      <div class="card" onclick="alert('Product: ${p.title}')">
        <img src="${p.image || 'https://via.placeholder.com/400x300/111/00ff88?text=No+Image'}" class="card-img">
        <div class="card-body">
          <div class="card-title">${p.title}</div>
          <div class="card-price">₦${Number(p.price).toLocaleString()}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-footer">
            <span>${p.location || 'PH'}</span>
            <span class="badge">${p.category || 'Gen'}</span>
          </div>
        </div>
      </div>
    `).join('');
  } 
  
  else {
    let jobs = JSON.parse(localStorage.getItem("marketSaleJobs")) || [];
    if(jobs.length === 0){
      grid.innerHTML = `<div class="empty"><h3>No jobs yet</h3><p>Be the first to post a job!</p></div>`;
      return;
    }
    grid.innerHTML = jobs.reverse().map(j => `
      <div class="card job" onclick="alert('Job: ${j.title}')">
        <div class="card-body">
          <div class="card-title">${j.title}</div>
          <div class="card-price">${j.salary || 'Negotiable'}</div>
          <div class="card-desc">${j.description}</div>
          <div class="card-footer">
            <span>${j.location || 'PH'}</span>
            <span class="badge">${j.type || 'Full Time'}</span>
          </div>
        </div>
      </div>
    `).join('');
  }
}

loadData();
</script>

</body>
</html>
