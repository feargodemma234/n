<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial, sans-serif;}
    body{background:#05050a;color:white;background-image: radial-gradient(circle at 20% 50%, rgba(0,255,136,0.05) 0%, transparent 50%);min-height:100vh;}
    
    header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,255,136,0.1);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;}
    .logo{display:flex;align-items:center;gap:8px;}
    .logo img{width:32px;height:32px;border-radius:8px;border:1.5px solid #00ff88;}
    .logo h1{background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:15px;font-weight:800;}
    .header-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
    .btn{padding:7px 10px;border-radius:8px;border:none;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:0.2s;}
    .btn:hover{transform:translateY(-1px);}
    .btn-green{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}
    .btn-red{background:rgba(255,68,68,0.1);color:#ff4444;border:1px solid rgba(255,68,68,0.3);}
    .btn-admin{background:linear-gradient(90deg,#ffaa00,#ff6600);color:#000;display:none;}
    .user-email{display:none;font-size:9px;color:#888;}
    .user-status{display:none;font-size:9px;font-weight:700;}

    .tabs{display:flex;gap:8px;margin:15px 12px;background:rgba(20,20,25,0.6);padding:6px;border-radius:12px;border:1px solid rgba(0,255,136,0.1);}
    .tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#888;transition:0.3s;}
    .tab.active{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;}

    .logout-bar{display:flex;justify-content:center;padding:0 12px 15px;max-width:1400px;margin:0 auto;}
    .logout-bar .btn-red{width:100%;padding:10px;font-size:12px;background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.4);}

    .container{max-width:1400px;margin:0 auto;padding:0 12px 20px;}
    .hero{text-align:center;margin-bottom:15px;padding:8px 0;}
    .hero h2{font-size:18px;margin-bottom:4px;background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .hero p{color:#888;font-size:10px;}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .card{background:rgba(20,20,25,0.6);backdrop-filter:blur(15px);border:1px solid rgba(0,255,136,0.15);border-radius:14px;overflow:hidden;transition:0.3s;}
    .card:hover{transform:translateY(-4px);border-color:rgba(0,255,136,0.4);box-shadow:0 5px 20px rgba(0,255,136,0.1);}
    .card-img{width:100%;height:140px;object-fit:cover;background:#111;}
    .card-body{padding:10px;}
    .card-title{font-size:13px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .card-price{font-size:15px;font-weight:800;color:#00ff88;margin-bottom:6px;}
    .card-desc{font-size:10px;color:#aaa;margin-bottom:8px;height:28px;overflow:hidden;line-height:1.4;}
    .card-footer{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#666;margin-bottom:8px;}
    .badge{padding:3px 6px;background:rgba(0,204,255,0.1);color:#00ccff;border-radius:5px;font-size:9px;font-weight:600;}
    
    .contact-box{background:rgba(0,255,136,0.05);border:1px solid rgba(0,255,136,0.2);padding:8px;border-radius:8px;font-size:9px;margin-bottom:8px;line-height:1.5;}
    .contact-box a{color:#00ff88;text-decoration:none;}
    .my-btns{display:flex;gap:5px;margin-top:8px;}
    .btn-sm{flex:1;padding:6px;font-size:9px;border-radius:6px;border:none;cursor:pointer;font-weight:700;transition:0.2s;}
    .btn-sm:hover{transform:scale(1.05);}
    .btn-edit{background:rgba(0,204,255,0.2);color:#00ccff;border:1px solid rgba(0,204,255,0.3);}
    .btn-delete{background:rgba(255,68,68,0.2);color:#ff4444;border:1px solid rgba(255,68,68,0.3);}
    
    .card.job{border-color:rgba(0,204,255,0.15);}
    .card.job:hover{border-color:rgba(0,204,255,0.4);}
    .card.job .card-price{color:#00ccff;}
    .empty{text-align:center;padding:40px 20px;color:#555;}
    .empty h3{margin-bottom:8px;}
    .empty a{color:#00ff88;text-decoration:none;font-weight:700;}
    
    .msg{padding:12px;border-radius:10px;margin:12px;margin-bottom:0;font-size:12px;text-align:center;display:none;font-weight:600;}
    .msg.success{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.3);}

    @media(min-width:769px){
      .user-email,.user-status{display:block;margin-right:8px;}
      .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
      .hero h2{font-size:24px;}.card-img{height:180px;}
      .btn{padding:9px 14px;font-size:12px;}.tabs{max-width:1400px;margin:20px auto;}
      .logout-bar{max-width:1400px;margin:0 auto 20px;}
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><img src="logo.png" alt="Logo"><h1>MarketSale</h1></div>
  <div class="header-btns" id="headerBtns">
    <span class="user-email" id="userEmail"></span>
    <span class="user-status" id="accessStatus"></span>
    <button class="btn btn-admin" id="adminBtn" onclick="location.href='admin.html'">ADMIN</button>
    <button class="btn btn-green" onclick="location.href='mylistings.html'">MY LISTINGS</button>
    <button class="btn btn-green" id="postBtn">+SELL</button>
  </div>
</header>

<div class="msg success" id="msgBox"></div>

<div class="tabs">
  <div class="tab active" id="productsTab" onclick="switchTab('products')">🛍️ PRODUCTS</div>
  <div class="tab" id="jobsTab" onclick="switchTab('jobs')">💼 JOBS</div>
</div>

<div class="logout-bar">
  <button class="btn btn-red" onclick="logout()">LOG OUT</button>
</div>

<div class="container">
  <div class="hero">
    <h2 id="heroTitle">Find Your Next Deal</h2>
    <p id="heroDesc">Buy and sell in Port Harcourt</p>
  </div>
  <div class="grid" id="grid"><div class="empty"><h3>Loading...</h3></div></div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co' // <-- PASTE YOUR URL HERE
const SUPABASE_KEY = 'YOUR-ANON-KEY' // <-- PASTE YOUR ANON KEY HERE
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const ADMIN_EMAIL = "marketsaleofficial@gmail.com";

let currentTab = 'products';
let hasAccess = false;

let loggedIn = localStorage.getItem("marketSaleLoggedIn");
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
if(loggedIn !== "true" || !user){ location.href = "login.html"; }

document.getElementById("userEmail").innerText = user.email;

async function checkAccess(){
  const { data } = await supabase.from('paid_users').select('*').eq('email', user.email).single();
  let accessUntil = data ? new Date(data.access_until) : null;
  
  let accessSpan = document.getElementById("accessStatus");
  let headerBtns = document.getElementById("headerBtns");
  let postBtn = document.getElementById("postBtn");

  if(accessUntil && accessUntil > new Date()){
    hasAccess = true;
    let daysLeft = Math.ceil((accessUntil - new Date()) / (1000*60*60*24));
    accessSpan.innerText = `${daysLeft} days left`;
    accessSpan.style.color = "#00ff88";
    postBtn.innerText = currentTab === 'products' ? '+SELL' : '+JOB';
    postBtn.onclick = () => location.href = currentTab === 'products' ? 'post.html' : 'job.html';
  } else {
    hasAccess = false;
    accessSpan.innerText = "NO ACCESS";
    accessSpan.style.color = "#ff4444";
    
    if(!document.querySelector('.btn-pay')){
      let payBtn = document.createElement("button");
      payBtn.className = "btn btn-green btn-pay";
      payBtn.innerText = "PAY $10";
      payBtn.onclick = () => location.href = 'payment.html';
      headerBtns.insertBefore(payBtn, postBtn);
    }
    
    postBtn.innerText = 'PAY $10';
    postBtn.onclick = () => location.href = 'payment.html';
  }
  loadData();
}

if(user.email.toLowerCase() === ADMIN_EMAIL){ 
  document.getElementById("adminBtn").style.display = "block"; 
}

function logout(){
  localStorage.removeItem("marketSaleLoggedIn");
  localStorage.removeItem("marketSaleUser");
  location.href = "login.html";
}

function showMsg(text){ 
  let box = document.getElementById('msgBox'); 
  box.innerText = text; 
  box.style.display = 'block'; 
  setTimeout(()=>box.style.display='none',3000); 
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  
  if(tab === 'products'){
    document.getElementById('productsTab').classList.add('active');
    document.getElementById('heroTitle').innerText = 'Find Your Next Deal';
    document.getElementById('heroDesc').innerText = 'Buy and sell in Port Harcourt';
    let postBtn = document.getElementById("postBtn");
    postBtn.innerText = hasAccess ? '+SELL' : 'PAY $10';
    postBtn.onclick = hasAccess ? () => location.href = 'post.html' : () => location.href = 'payment.html';
  } else {
    document.getElementById('jobsTab').classList.add('active');
    document.getElementById('heroTitle').innerText = 'Find Your Next Job';
    document.getElementById('heroDesc').innerText = 'Work opportunities in Port Harcourt';
    let postBtn = document.getElementById("postBtn");
    postBtn.innerText = hasAccess ? '+JOB' : 'PAY $10';
    postBtn.onclick = hasAccess ? () => location.href = 'job.html' : () => location.href = 'payment.html';
  }
  loadData();
}

async function deleteItem(id, type){
  if(!confirm("Delete this item?")) return;
  if(type === 'product'){
    await supabase.from('products').delete().eq('id', id);
  } else {
    await supabase.from('jobs').delete().eq('id', id);
  }
  showMsg("✅ Item deleted");
  loadData();
}

function editItem(id, type){
  if(!hasAccess) return location.href = 'payment.html';
  localStorage.setItem("editId", id);
  localStorage.setItem("editType", type);
  location.href = type === 'product' ? 'post.html?edit=1' : 'job.html?edit=1';
}

async function loadData(){
  let grid = document.getElementById("grid");
  
  if(currentTab === 'products'){
    let { data: products, error } = await supabase.from('products').select('*').eq('approved', true).order('id', {ascending: false});
    if(error) console.log(error);
    if(!products || products.length === 0){
      grid.innerHTML = `<div class="empty"><h3>No products yet</h3><p><a href="${hasAccess ? 'post.html' : 'payment.html'}">Be the first to sell!</a></p></div>`;
      return;
    }
    grid.innerHTML = products.map(p => {
      let isMine = p.seller === user.email;
      return `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/400x300/111/00ff88?text=No+Image'}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300/111/00ff88?text=No+Image'">
        <div class="card-body">
          <div class="card-title">${p.title}</div>
          <div class="card-price">₦${Number(p.price).toLocaleString()}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-footer">
            <span>${p.location || 'Port Harcourt'}</span>
            <span class="badge">${p.category || 'General'}</span>
          </div>
          <div class="contact-box">
            <b>Email:</b> ${p.seller}<br>
            <b>WhatsApp:</b> <a href="https://wa.me/${p.whatsapp || ''}" target="_blank">${p.whatsapp || 'Not provided'}</a>
          </div>
          ${isMine ? `<div class="my-btns"><button class="btn-sm btn-edit" onclick="editItem(${p.id},'product')">EDIT</button><button class="btn-sm btn-delete" onclick="deleteItem(${p.id},'product')">DELETE</button></div>` : ''}
        </div>
      </div>`;
    }).join('');
  } 
  
  else {
    let { data: jobs, error } = await supabase.from('jobs').select('*').order('id', {ascending: false});
    if(error) console.log(error);
    if(!jobs || jobs.length === 0){
      grid.innerHTML = `<div class="empty"><h3>No jobs yet</h3><p><a href="${hasAccess ? 'job.html' : 'payment.html'}">Be the first to post a job!</a></p></div>`;
      return;
    }
    grid.innerHTML = jobs.map(j => {
      let isMine = j.seller === user.email;
      return `
      <div class="card job">
        <div class="card-body">
          <div class="card-title">${j.title}</div>
          <div class="card-price">${j.salary || 'Negotiable'}</div>
          <div class="card-desc">${j.description}</div>
          <div class="card-footer">
            <span>${j.location || 'Port Harcourt'}</span>
            <span class="badge">${j.type || 'Full Time'}</span>
          </div>
          <div class="contact-box">
            <b>Email:</b> ${j.seller}<br>
            <b>WhatsApp:</b> <a href="https://wa.me/${j.whatsapp || ''}" target="_blank">${j.whatsapp || 'Not provided'}</a>
          </div>
          ${isMine ? `<div class="my-btns"><button class="btn-sm btn-edit" onclick="editItem(${j.id},'job')">EDIT</button><button class="btn-sm btn-delete" onclick="deleteItem(${j.id},'job')">DELETE</button></div>` : ''}
        </div>
      </div>`;
    }).join('');
  }
}

checkAccess();
</script>
</body>
</html>
