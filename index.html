<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sale</title>
  <link rel="icon" href="logo.png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial;}
   .navbar {background:#151515; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; position:sticky; top:0; z-index:100;}
   .logo {width:35px; height:35px; border-radius:10px;}
   .welcome {color:#00ff88; font-weight:600; font-size:13px;}
   .btn-logout {background:#ff4444; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:12px;}
   .header {padding:15px; display:flex; justify-content:space-between; align-items:center;}
   .btn-post {background:#00ff88; color:#000; padding:12px 18px; border-radius:10px; border:none; font-weight:bold; font-size:14px; cursor:pointer;}
   .container {padding:0 12px 30px; max-width:1200px; margin:0 auto;}
   .products {display:grid; grid-template-columns:repeat(auto-fill, minmax(155px, 1fr)); gap:10px;}
   .product-card {background:#151515; border-radius:10px; border:1px solid #333; overflow:hidden; cursor:pointer;}
   .product-card:active {border-color:#00ff88; transform:scale(0.96);}
   .product-img {width:100%; height:110px; background:#1a1a1a; object-fit:cover;}
   .product-info {padding:8px;}
   .product-title {font-size:12px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
   .product-price {color:#00ff88; font-size:13px; font-weight:bold;}
   .product-seller {font-size:9px; color:#aaa; margin-top:2px;}
   .empty {text-align:center; padding:60px 20px; color:#666;}
    @media(min-width:768px){.products {grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));} }
  </style>
</head>
<body>
<div class="navbar">
  <img src="logo.png" class="logo">
  <div><span id="welcomeUser" class="welcome"></span> <button id="logoutBtn" class="btn-logout">Logout</button></div>
</div>
<div class="header">
  <h1 style="color:#00ff88; font-size:20px;">Marketplace</h1>
  <button id="postBtn" class="btn-post">+ Post $2</button>
</div>
<div class="container">
  <div id="productsGrid" class="products"></div>
  <div id="emptyMsg" class="empty" style="display:none;"><h2>No products yet</h2></div>
</div>
<script>
if(localStorage.getItem("marketSaleLoggedIn")!== "true"){ window.location.href = "login.html"; }
document.addEventListener("DOMContentLoaded", function(){
  let user = JSON.parse(localStorage.getItem("marketSaleUser"));
  if(user){ document.getElementById("welcomeUser").innerText = "Hi, " + user.name.toUpperCase(); }
  loadProducts();
  document.getElementById("logoutBtn").onclick = ()=>{ localStorage.clear(); window.location.href = "login.html"; }
  document.getElementById("postBtn").onclick = ()=>{ window.location.href = "post-product.html"; }
});
function loadProducts(){
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let grid = document.getElementById("productsGrid");
  if(products.length === 0){ document.getElementById("emptyMsg").style.display = "block"; return; }
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="viewProduct('${p.id}')">
      ${p.image? `<img src="${p.image}" class="product-img">` : `<div class="product-img"></div>`}
      <div class="product-info">
        <div class="product-title">${p.title}</div>
        <div class="product-price">$${p.price}</div>
        <div class="product-seller">${p.seller}</div>
      </div>
    </div>
  `).join('');
}
function viewProduct(id){ localStorage.setItem("viewProductId", id); window.location.href = "product-detail.html"; }
</script>
</body>
</html>
