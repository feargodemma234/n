<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace</title>
  <link rel="icon" href="logo.png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial;}
   .navbar {background:#151515; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; position:sticky; top:0; z-index:100;}
   .logo {width:35px; height:35px; border-radius:10px;}
   .nav-btns {display:flex; gap:6px;}
   .btn {background:#00ff88; color:#000; padding:8px 12px; border-radius:8px; border:none; font-weight:bold; font-size:11px; cursor:pointer; text-decoration:none;}
   .btn-admin {background:#444;color:white;display:none;}
   .btn-job {background:#ffaa00;color:#000;}
    .header {padding:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
    h1{color:#00ff88; font-size:20px;}
   .filter-box{padding:0 15px 10px;}
   .filter-input{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:white;font-size:12px;}
   .user-profile{display:flex;align-items:center;gap:8px;background:#151515;padding:6px 10px;border-radius:20px;border:1px solid #333;}
   .user-avatar{width:28px;height:28px;border-radius:50%;background:#00ff88;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;font-size:12px;}
   .user-email{font-size:10px;color:#aaa;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
   .logout-btn{background:#ff4444;color:white;padding:4px 8px;border-radius:15px;border:none;font-size:9px;cursor:pointer;}
    .container {padding:0 12px 30px; max-width:1200px; margin:0 auto;}
    .products {display:grid; grid-template-columns:repeat(auto-fill, minmax(155px, 1fr)); gap:10px;}
   .product-card {background:#151515; border-radius:10px; border:1px solid #333; overflow:hidden; position:relative;}
   .product-card:active {border-color:#00ff88; transform:scale(0.96);}
   .product-img {width:100%; height:110px; background:#1a1a1a; object-fit:cover; cursor:pointer;}
   .product-info {padding:8px;}
   .product-title {font-size:12px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
   .product-country {font-size:9px;color:#ffaa00;margin-top:1px;}
   .product-price {color:#00ff88; font-size:13px; font-weight:bold; margin-top:2px;}
   .product-seller {font-size:9px; color:#aaa; margin-top:2px;}
   .badge-job {background:#ffaa00; color:#000; font-size:8px; padding:2px 5px; border-radius:4px; font-weight:bold;margin-bottom:3px;display:inline-block;}
   .owner-btns{display:flex;gap:5px;margin-top:6px;}
   .btn-edit{background:#0088ff;color:white;padding:4px;border:none;border-radius:5px;font-size:9px;cursor:pointer;width:50%;}
   .btn-delete{background:#ff4444;color:white;padding:4px;border:none;border-radius:5px;font-size:9px;cursor:pointer;width:50%;}
   .empty {text-align:center; padding:60px 20px; color:#666;}
    @media(min-width:768px){.products {grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));} }
  </style>
</head>
<body>
<div class="navbar">
  <img src="logo.png" class="logo">
  <div class="nav-btns">
    <a href="admin.html" class="btn btn-admin" id="adminBtn">Admin</a>
    <a href="post-job.html" class="btn btn-job">+ Job $10</a>
    <a href="post.html" class="btn">+ Post $2</a>
  </div>
</div>

<div class="header">
  <h1>Marketplace</h1>
  <div class="user-profile" id="userProfile" style="display:none;">
    <div class="user-avatar" id="userAvatar"></div>
    <div class="user-email" id="userEmail"></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<div class="filter-box">
  <input type="text" class="filter-input" id="countrySearch" placeholder="🔍 Search country... e.g Nigeria, USA, Remote" onkeyup="loadProducts()">
</div>

<div class="container">
  <div id="productsGrid" class="products"></div>
  <div id="emptyMsg" class="empty" style="display:none;">
    <h2>No products found</h2>
    <p style="margin-top:10px;font-size:12px;">Try a different country or post the first one!</p>
  </div>
</div>
<script>
const ADMIN_EMAIL = "marketsaleofficial@gmail.com";
let user = JSON.parse(localStorage.getItem("marketSaleUser"));

if(!localStorage.getItem("marketSaleLoggedIn")){
  location.href = "login.html";
}

if(user){
  document.getElementById("userProfile").style.display = "flex";
  document.getElementById("userEmail").innerText = user.email;
  document.getElementById("userAvatar").innerText = user.email.charAt(0).toUpperCase();
}

if(user && user.email === ADMIN_EMAIL){
  document.getElementById("adminBtn").style.display = "block";
}

function logout(){
  localStorage.removeItem("marketSaleLoggedIn");
  localStorage.removeItem("marketSaleUser");
  location.href = "login.html";
}

loadProducts();
function loadProducts(){
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let search = document.getElementById("countrySearch").value.toLowerCase();

  if(search){
    products = products.filter(p => p.country && p.country.toLowerCase().includes(search));
  }

  let grid = document.getElementById("productsGrid");
  if(products.length === 0){ document.getElementById("emptyMsg").style.display = "block"; return; }
  document.getElementById("emptyMsg").style.display = "none";

  grid.innerHTML = products.map(p => {
    let isOwner = user && p.email === user.email;
    return `
    <div class="product-card">
      ${p.image? `<img src="${p.image}" class="product-img" onclick="location.href='details.html?id=${p.id}'">` : `<div class="product-img" onclick="location.href='details.html?id=${p.id}'"></div>`}
      <div class="product-info" onclick="location.href='details.html?id=${p.id}'">
        ${p.type === 'job'? '<div class="badge-job">JOB</div>' : ''}
        <div class="product-title">${p.title}</div>
        <div class="product-country">📍 ${p.country || 'N/A'}</div>
        <div class="product-price">$${p.price}</div>
        <div class="product-seller">Seller: ${p.email}</div>
      </div>
      ${isOwner ? `
        <div class="product-info owner-btns">
          <button class="btn-edit" onclick="event.stopPropagation(); editProduct('${p.id}')">✏️ Edit</button>
          <button class="btn-delete" onclick="event.stopPropagation(); deleteProduct('${p.id}')">🗑️ Delete</button>
        </div>
      ` : ''}
    </div>
  `}).join('');
}

function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  products = products.filter(p => p.id != id);
  localStorage.setItem("marketSaleProducts", JSON.stringify(products));
  loadProducts();
}

function editProduct(id){
  location.href = `edit.html?id=${id}`;
}
</script>
</body>
</html>
