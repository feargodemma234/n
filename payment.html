    body{

    .container{

    }
    .back-btn{

      padding:10px 14px;

      color:#00ccff;
      border:1px solid rgba(0,204,255,0.3);
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
      transition:0.3s;
    }
    .back-btn:hover{
      background:rgba(0,204,255,0.25);
    }
    .crypto-box{
      background:rgba(20,20,25,0.7);
      backdrop-filter:blur(15px);
      border:1px solid rgba(0,255,136,0.3);
      padding:25px;
      border-radius:16px;
      box-shadow:0 0 30px rgba(0,255,136,0.1);

    .crypto-box h3{

      font-size:18px;
      margin-bottom:15px;
      text-align:center;
      font-weight:800;
    }
    .warning-box{
      background:rgba(255,68,68,0.15);
      border:1px solid #ff4444;
      padding:14px;
      border-radius:10px;
      margin-bottom:20px;
      text-align:center;
    }

      font-size:13px;
      font-weight:800;
      margin-bottom:4px;
    }
    .warning-box p:last-child{
      color:#aaa;
      font-size:10px;
    }
    .qr-wrap{
      text-align:center;
      margin:20px 0;
    }
    .qr-wrap img{
      width:220px;
      height:220px;
      border-radius:16px;
      border:3px solid #00ff88;
      background:white;
      padding:12px;
      box-shadow:0 0 20px rgba(0,255,136,0.3);
    }
    .qr-wrap p{
      font-size:11px;
      color:#888;
      margin-top:8px;
    }
    .label{
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
      display:block;
      color:#00ff88;
    }
    .crypto-wallet{
      background:#0a0a0f;
      padding:14px;
      border-radius:10px;
      font-size:12px;
      word-break:break-all;
      margin:10px 0 15px 0;
      border:1px dashed #00ff88;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .copy-btn{
      padding:7px 14px;
      background:#00ff88;
      color:#000;
      border:none;
      border-radius:7px;
      font-size:11px;
      cursor:pointer;
      font-weight:800;
      flex-shrink:0;
    }
    .copy-btn:active{
      transform:scale(0.95);
    }
    .info-box{
      background:rgba(0,204,255,0.1);
      border:1px solid rgba(0,204,255,0.2);
      padding:12px;
      border-radius:8px;
      font-size:11px;
      margin:15px 0;
      text-align:center;
      color:#00ccff;
    }
    input{
      width:100%;
      padding:14px;
      background:#111;
      border:1px solid #333;
      border-radius:10px;
      color:white;
      margin-bottom:12px;
      font-size:12px;
      outline:none;
    }
    input:focus{
      border-color:#00ff88;
    }
    .btn{
      padding:14px;
      border-radius:10px;
      border:none;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      width:100%;
      transition:0.3s;
    }
    .btn-green{
      background:linear-gradient(90deg,#00ff88,#00ccff);
      color:#000;
      margin-bottom:10px;
    }
    .btn-green:hover{
      transform:translateY(-2px);
      box-shadow:0 5px 15px rgba(0,255,136,0.3);
    }
    .btn-email{
      background:rgba(0,204,255,0.2);
      color:#00ccff;
      border:1px solid #00ccff;
    }
    .btn-email:hover{
      background:rgba(0,204,255,0.3);
    }
    .footer-note{
      font-size:10px;
      color:#666;
      margin-top:15px;
      text-align:center;
      line-height:1.5;
    }
  </style>
</head>
