<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{
      background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,#0a0a0a 100%);
      color:white;display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:20px;overflow:hidden;
    }
   .bg-blob{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#00ccff 0%,transparent 70%);opacity:0.1;filter:blur(80px);z-index:0;}
   .blob1{top:-100px;right:-100px;}
   .blob2{bottom:-100px;left:-100px;background:radial-gradient(circle,#00ff88 0%,transparent 70%);}

   .signup-box{
      background:rgba(20,20,20,0.6);backdrop-filter:blur(20px);
      padding:30px;border-radius:20px;border:1px solid rgba(0,204,255,0.2);
      width:100%;max-width:420px;position:relative;z-index:1;
      box-shadow:0 0 40px rgba(0,204,255,0.1);
      animation:fadeIn 0.5s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

   .logo{text-align:center;margin-bottom:25px;}
   .logo img{width:70px;height:70px;border-radius:20px;margin-bottom:12px;border:2px solid #00ccff;box-shadow:0 0 20px rgba(0,204,255,0.3);}
   .logo h1{background:linear-gradient(90deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:24px;font-weight:800;}

   .form-group{margin-bottom:18px;}
    label{display:block;margin-bottom:8px;color:#aaa;font-size:12px;font-weight:600;letter-spacing:0.5px;}
    input{
      width:100%;padding:14px;background:rgba(30,30,30,0.8);border:1px solid #333;
      border-radius:12px;color:white;font-size:14px;transition:all 0.3s;
    }
    input:focus{outline:none;border-color:#00ccff;box-shadow:0 0 15px rgba(0,204,255,0.2);background:rgba(40,40,40,0.8);}

   .btn{
      background:linear-gradient(90deg,#00ccff,#00ff88);color:#000;
      padding:14px;border-radius:12px;border:none;font-weight:800;width:100%;
      font-size:15px;cursor:pointer;margin-top:12px;transition:all 0.3s;
      box-shadow:0 4px 15px rgba(0,204,255,0.3);
    }
   .btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,204,255,0.4);}

   .link{text-align:center;margin-top:18px;font-size:13px;color:#888;}
   .link a{color:#00ccff;text-decoration:none;font-weight:700;cursor:pointer;transition:0.3s;}
   .link a:hover{text-shadow:0 0 10px #00ccff;}

   .error{
      background:rgba(255,68,68,0.1);color:#ff4444;padding:12px;border-radius:12px;
      margin-bottom:18px;font-size:13px;text-align:center;display:none;
      border:1px solid rgba(255,68,68,0.3);backdrop-filter:blur(10px);
    }
   .success{
      background:rgba(0,255,136,0.1);color:#00ff88;padding:12px;border-radius:12px;
      margin-bottom:18px;font-size:13px;text-align:center;display:none;
      border:1px solid rgba(0,255,136,0.3);backdrop-filter:blur(10px);
    }
  </style>
</head>
<body>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="signup-box">
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <h1>Create Account</h1>
  </div>

  <div class="error" id="errorBox"></div>
  <div class="success" id="successBox"></div>

  <form id="signupForm">
    <div class="form-group">
      <label>EMAIL</label>
      <input type="email" id="email" placeholder="you@email.com" required>
    </div>
    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
    </div>
    <button class="btn">SIGN UP</button>
  </form>

  <div class="link">
    Already have account? <a href="login.html">Login</a>
  </div>
</div>

<script>
signupForm.onsubmit = e => {
  e.preventDefault();
  errorBox.style.display = "none";
  successBox.style.display = "none";
  
  let emailVal = email.value.trim().toLowerCase();
  let passVal = password.value;
  
  if(passVal.length < 6){
    errorBox.style.display = "block";
    errorBox.innerText = "❌ Password must be at least 6 characters";
    return;
  }
  
  let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
  
  if(users.find(u => u.email === emailVal)){
    errorBox.style.display = "block";
    errorBox.innerText = "❌ This email already exists";
    return;
  }
  
  let newUser = {email: emailVal, password: passVal};
  users.push(newUser);
  localStorage.setItem("marketSaleUsers", JSON.stringify(users));
  
  successBox.style.display = "block";
  successBox.innerText = "✅ Account created! Redirecting...";
  
  setTimeout(() => {
    location.href = "login.html";
  }, 1500);
}
</script>
</body>
</html>
