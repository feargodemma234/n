<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a0a;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
    .signup-box{background:#151515;padding:25px;border-radius:15px;border:1px solid #333;width:100%;max-width:400px;}
    .logo{text-align:center;margin-bottom:20px;}
    .logo img{width:60px;height:60px;border-radius:15px;margin-bottom:10px;}
    .logo h1{color:#00ff88;font-size:22px;}
    .form-group{margin-bottom:15px;}
    label{display:block;margin-bottom:6px;color:#aaa;font-size:12px;}
    input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:white;font-size:14px;}
    input:focus{outline:none;border-color:#00ff88;}
    .btn{background:#00ff88;color:#000;padding:12px;border-radius:8px;border:none;font-weight:bold;width:100%;font-size:14px;cursor:pointer;margin-top:10px;}
    .btn:hover{background:#00cc6a;}
    .link{text-align:center;margin-top:15px;font-size:12px;color:#aaa;}
    .link a{color:#00ff88;text-decoration:none;font-weight:bold;}
    .error{background:#2a0000;color:#ff4444;padding:10px;border-radius:8px;margin-bottom:15px;font-size:12px;text-align:center;display:none;border:1px solid #ff4444;}
    .success{background:#002a00;color:#00ff88;padding:10px;border-radius:8px;margin-bottom:15px;font-size:12px;text-align:center;display:none;border:1px solid #00ff88;}
  </style>
</head>
<body>
<div class="signup-box">
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <h1>Create Account</h1>
  </div>

  <div class="error" id="errorBox"></div>
  <div class="success" id="successBox"></div>

  <form id="signupForm">
    <div class="form-group">
      <label>Email *</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
      <label>Password *</label>
      <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
    </div>
    <button class="btn">Sign Up</button>
  </form>

  <div class="link">
    Already have account? <a href="login.html">Login</a>
  </div>
</div>

<script>
signupForm.onsubmit = e => {
  e.preventDefault();
  errorBox.style.display = "none";
  successBox.style.display = "none";
  
  let emailVal = email.value.trim().toLowerCase();
  let passVal = password.value;
  
  if(passVal.length < 6){
    errorBox.style.display = "block";
    errorBox.innerText = "❌ Password must be at least 6 characters";
    return;
  }
  
  let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
  
  if(users.find(u => u.email === emailVal)){
    errorBox.style.display = "block";
    errorBox.innerText = "❌ This email already exists";
    return;
  }
  
  let newUser = {email: emailVal, password: passVal};
  users.push(newUser);
  localStorage.setItem("marketSaleUsers", JSON.stringify(users));
  
  successBox.style.display = "block";
  successBox.innerText = "✅ Account created! Redirecting to login...";
  
  setTimeout(() => {
    location.href = "login.html";
  }, 1500);
}
</script>
</body>
</html>
