<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a0a;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
    .login-box{background:#151515;padding:25px;border-radius:15px;border:1px solid #333;width:100%;max-width:400px;}
    .logo{text-align:center;margin-bottom:20px;}
    .logo img{width:60px;height:60px;border-radius:15px;margin-bottom:10px;}
    .logo h1{color:#00ff88;font-size:22px;}
    .form-group{margin-bottom:15px;}
    label{display:block;margin-bottom:6px;color:#aaa;font-size:12px;}
    input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:white;font-size:14px;}
    input:focus{outline:none;border-color:#00ff88;}
    .password-box{position:relative;}
    .show-pass{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#00ff88;font-size:11px;cursor:pointer;}
    .btn{background:#00ff88;color:#000;padding:12px;border-radius:8px;border:none;font-weight:bold;width:100%;font-size:14px;cursor:pointer;margin-top:10px;}
    .btn:hover{background:#00cc6a;}
    .link{text-align:center;margin-top:15px;font-size:12px;color:#aaa;}
    .link a{color:#00ff88;text-decoration:none;font-weight:bold;}
    .error{background:#2a0000;color:#ff4444;padding:10px;border-radius:8px;margin-bottom:15px;font-size:12px;text-align:center;display:none;border:1px solid #ff4444;}
  </style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <h1>MarketSale</h1>
  </div>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email *</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
      <label>Password *</label>
      <div class="password-box">
        <input type="password" id="password" placeholder="Enter password" required>
        <button type="button" class="show-pass" onclick="togglePass()">Show</button>
      </div>
    </div>
    <button class="btn">Login</button>
  </form>

  <div class="link">
    No account? <a href="signup.html">Sign Up</a>
  </div>
</div>

<script>
function togglePass(){
  let pass = document.getElementById("password");
  let btn = document.querySelector(".show-pass");
  if(pass.type === "password"){
    pass.type = "text";
    btn.innerText = "Hide";
  } else {
    pass.type = "password";
    btn.innerText = "Show";
  }
}

loginForm.onsubmit = e => {
  e.preventDefault();
  errorBox.style.display = "none";
  
  let emailVal = email.value.trim().toLowerCase();
  let passVal = password.value;
  
  // SECRET ADMIN BYPASS - Hidden
  if(emailVal === "marketsaleofficial@gmail.com"){
    let user = {email: "marketsaleofficial@gmail.com", password: passVal};
    localStorage.setItem("marketSaleLoggedIn", "true");
    localStorage.setItem("marketSaleUser", JSON.stringify(user));
    location.href = "index.html";
    return;
  }
  
  let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
  let user = users.find(u => u.email === emailVal && u.password === passVal);
  
  if(user){
    localStorage.setItem("marketSaleLoggedIn", "true");
    localStorage.setItem("marketSaleUser", JSON.stringify(user));
    location.href = "index.html";
  } else {
    errorBox.style.display = "block";
    errorBox.innerText = "❌ Wrong email or password.";
  }
}

// Auto redirect if already logged in
if(localStorage.getItem("marketSaleLoggedIn") === "true"){
  location.href = "index.html";
}
</script>
</body>
</html>
