<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Job - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{background:#05050a;color:white;padding:20px;}
    header{max-width:800px;margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between;}
   .logo{display:flex;align-items:center;gap:10px;}
   .logo img{width:40px;height:40px;border-radius:12px;border:2px solid #00ccff;}
   .logo h1{background:linear-gradient(90deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;font-weight:800;}
   .btn-back{padding:10px 16px;background:rgba(50,50,50,0.8);color:white;border:1px solid #444;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;}
   .post-box{max-width:800px;margin:0 auto;background:rgba(20,20,25,0.6);padding:30px;border-radius:20px;border:1px solid rgba(0,204,255,0.2);}
   .post-box h2{text-align:center;margin-bottom:10px;font-size:24px;background:linear-gradient(90deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
   .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
   .form-group{margin-bottom:18px;}.full{grid-column:1 / -1;}
    label{display:block;margin-bottom:8px;color:#aaa;font-size:12px;font-weight:600;}
    input,textarea,select{width:100%;padding:14px;background:rgba(30,30,30,0.8);border:1px solid #333;border-radius:12px;color:white;font-size:14px;}
    textarea{min-height:120px;resize:vertical;}
   .btn{background:linear-gradient(90deg,#00ccff,#00ff88);color:#000;padding:16px;border-radius:12px;border:none;font-weight:800;width:100%;font-size:15px;cursor:pointer;margin-top:10px;}
   .msg{padding:12px;border-radius:10px;margin-bottom:18px;font-size:13px;text-align:center;display:none;font-weight:600;}
   .success{background:rgba(0,204,255,0.1);color:#00ccff;border:1px solid rgba(0,204,255,0.3);}
   .blocked{text-align:center;padding:40px;}.blocked h3{color:#ff4444;margin-bottom:10px;}
    @media(max-width:768px){.form-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header><div class="logo"><img src="logo.png"><h1>MarketSale Jobs</h1></div><a href="index.html" class="btn-back">← BACK</a></header>
<div class="post-box">
  <div class="msg success" id="successBox"></div>
  <div id="mainForm">
    <h2 id="formTitle">Post A Job</h2>
    <form id="jobForm">
      <div class="form-grid">
        <div class="form-group"><label>JOB TITLE *</label><input type="text" id="title" required></div>
        <div class="form-group"><label>SALARY ₦</label><input type="text" id="salary"></div>
        <div class="form-group"><label>JOB TYPE</label><select id="type"><option>Full Time</option><option>Part Time</option><option>Contract</option></select></div>
        <div class="form-group"><label>LOCATION</label><input type="text" id="location" value="Port Harcourt, Rivers"></div>
        <div class="form-group"><label>WHATSAPP NUMBER *</label><input type="text" id="whatsapp" placeholder="2348012345678" required></div>
        <div class="form-group full"><label>JOB DESCRIPTION *</label><textarea id="description" required></textarea></div>
      </div>
      <button class="btn">POST JOB</button>
    </form>
  </div>
  <div id="blockedBox" class="blocked" style="display:none;"><h3>❌ NO POSTING ACCESS</h3></div>
</div>
<script>
let user = JSON.parse(localStorage.getItem("marketSaleUser")); if(!user) location.href = "login.html";
let accessUntil = user.accessUntil? new Date(user.accessUntil) : null;
if(!accessUntil || accessUntil < new Date()){ document.getElementById('mainForm').style.display = 'none'; document.getElementById('blockedBox').style.display = 'block'; }
else { let daysLeft = Math.ceil((accessUntil - new Date()) / (1000*60*60*24)); document.getElementById('formTitle').innerText = `Post A Job - ${daysLeft} days left`; }

let editId = localStorage.getItem("editId");
if(editId){
  document.getElementById('formTitle').innerText = "Edit Your Job";
  document.querySelector('.btn').innerText = "UPDATE JOB";
  let jobs = JSON.parse(localStorage.getItem("marketSaleJobs")) || [];
  let item = jobs.find(j => j.id == editId && j.seller === user.email); // SECURITY
  if(item){ title.value=item.title; salary.value=item.salary; type.value=item.type; location.value=item.location; whatsapp.value=item.whatsapp; description.value=item.description; }
  else { localStorage.removeItem("editId"); }
}

jobForm.onsubmit = e => {
  e.preventDefault();
  let jobs = JSON.parse(localStorage.getItem("marketSaleJobs")) || [];
  let newJob = {
    id: editId ? Number(editId) : Date.now(),
    title: title.value, salary: salary.value, type: type.value, location: location.value,
    whatsapp: whatsapp.value, description: description.value, seller: user.email, date: new Date().toLocaleDateString()
  };
  if(editId){ jobs = jobs.map(j => j.id == editId ? newJob : j); localStorage.removeItem("editId"); }
  else { jobs.push(newJob); }
  localStorage.setItem("marketSaleJobs", JSON.stringify(jobs));
  document.getElementById('successBox').innerText = editId ? "✅ Job updated!" : "✅ Job posted!";
  document.getElementById('successBox').style.display = 'block';
  setTimeout(() => location.href = "index.html", 1500);
}
</script>
</body>
</html>
