<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Job - MarketSale</title>
  <link rel="icon" href="logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial;}
    body{
      background:#05050a;color:white;
      background-image: radial-gradient(circle at 80% 80%, rgba(0,204,255,0.08) 0%, transparent 50%);
      min-height:100vh;padding:20px;
    }
    header{max-width:800px;margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo img{width:40px;height:40px;border-radius:12px;border:2px solid #00ccff;}
  .logo h1{background:linear-gradient(90deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;font-weight:800;}
  .btn-back{padding:10px 16px;background:rgba(50,50,50,0.8);color:white;border:1px solid #444;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;}

  .post-box{max-width:800px;margin:0 auto;background:rgba(20,20,25,0.6);backdrop-filter:blur(20px);padding:30px;border-radius:20px;border:1px solid rgba(0,204,255,0.2);}
  .post-box h2{text-align:center;margin-bottom:10px;font-size:24px;background:linear-gradient(90deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .note{color:#00ccff;text-align:center;font-size:11px;margin-bottom:20px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .form-group{margin-bottom:18px;}.full{grid-column:1 / -1;}
    label{display:block;margin-bottom:8px;color:#aaa;font-size:12px;font-weight:600;}
    input,textarea,select{width:100%;padding:14px;background:rgba(30,30,30,0.8);border:1px solid #333;border-radius:12px;color:white;font-size:14px;}
    textarea{min-height:120px;resize:vertical;}

  .btn{background:linear-gradient(90deg,#00ccff,#00ff88);color:#000;padding:16px;border-radius:12px;border:none;font-weight:800;width:100%;font-size:15px;cursor:pointer;margin-top:10px;}
  
  .msg{padding:12px;border-radius:10px;margin-bottom:18px;font-size:13px;text-align:center;display:none;font-weight:600;}
  .success{background:rgba(0,204,255,0.1);color:#00ccff;border:1px solid rgba(0,204,255,0.3);}
  .blocked{text-align:center;padding:40px;}.blocked h3{color:#ff4444;margin-bottom:10px;}
    @media(max-width:768px){.form-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<header>
  <div class="logo"><img src="logo.png" alt="Logo"><h1>MarketSale Jobs</h1></div>
  <a href="index.html" class="btn-back">← BACK</a>
</header>

<div class="post-box">
  <div class="msg success" id="successBox"></div>

  <div id="mainForm">
    <h2 id="formTitle">Post A Job</h2>
    <p class="note">⚠️ Your job will be posted instantly</p>

    <form id="jobForm">
      <div class="form-grid">
        <div class="form-group">
          <label>JOB TITLE *</label>
          <input type="text" id="title" placeholder="Delivery Driver Needed" required>
        </div>
        <div class="form-group">
          <label>SALARY ₦</label>
          <input type="text" id="salary" placeholder="50,000 - 80,000 / month">
        </div>
        <div class="form-group">
          <label>JOB TYPE</label>
          <select id="type">
            <option>Full Time</option>
            <option>Part Time</option>
            <option>Contract</option>
            <option>Internship</option>
          </select>
        </div>
        <div class="form-group">
          <label>LOCATION</label>
          <input type="text" id="location" placeholder="Port Harcourt, Rivers" value="Port Harcourt, Rivers">
        </div>
        <div class="form-group full">
          <label>JOB DESCRIPTION *</label>
          <textarea id="description" placeholder="Duties, requirements, experience needed..." required></textarea>
        </div>
        <div class="form-group full">
          <label>CONTACT</label>
          <input type="text" id="contact" placeholder="WhatsApp or Phone">
        </div>
      </div>
      <button class="btn">POST JOB</button>
    </form>
  </div>

  <div id="blockedBox" class="blocked" style="display:none;">
    <h3>❌ NO POSTING ACCESS</h3>
    <p>Your 30-day access has expired.<br>Please pay and contact admin to renew.</p>
  </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("marketSaleUser"));
if(!user) location.href = "login.html";

// CHECK SUBSCRIPTION - NO POPUP
let accessUntil = user.accessUntil ? new Date(user.accessUntil) : null;
if(!accessUntil || accessUntil < new Date()){
  document.getElementById('mainForm').style.display = 'none';
  document.getElementById('blockedBox').style.display = 'block';
} else {
  let daysLeft = Math.ceil((accessUntil - new Date()) / (1000*60*60*24));
  document.getElementById('formTitle').innerText = `Post A Job - ${daysLeft} days left`;
}

jobForm.onsubmit = e => {
  e.preventDefault();
  let jobs = JSON.parse(localStorage.getItem("marketSaleJobs")) || [];

  let newJob = {
    id: Date.now(),
    title: title.value,
    salary: salary.value,
    type: type.value,
    location: location.value,
    description: description.value,
    contact: contact.value,
    seller: user.email,
    date: new Date().toLocaleDateString()
  };

  jobs.push(newJob);
  localStorage.setItem("marketSaleJobs", JSON.stringify(jobs));

  document.getElementById('successBox').innerText = "✅ Job posted successfully!";
  document.getElementById('successBox').style.display = 'block';
  
  setTimeout(() => location.href = "index.html", 1500);
}
</script>
</body>
</html>
